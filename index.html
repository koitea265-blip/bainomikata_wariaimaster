<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倍の見方・割合マスター</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Styles --- */
        body {
            font-family: 'Zen Maru Gothic', 'BIZ UDGothic', sans-serif;
            background-color: #f0f9ff;
            color: #1f2937;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 0;
            user-select: none; -webkit-print-color-adjust: exact;
        }
        input { user-select: text; }
        .screen { display: none; width: 100%; justify-content: center; }
        .screen.active { display: flex; }

        /* --- Home Screen --- */
        #home-screen { flex-direction: column; align-items: center; width: 100%; max-width: 1280px; padding: 2rem 1rem; }
        .grade-columns { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; width: 100%; margin-top: 1rem; }
        .grade-column {
            flex: 1 1 200px; max-width: 240px; background: white; border-radius: 1.5rem; padding: 1.5rem 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-top: 8px solid; display: flex; flex-direction: column; gap: 0.8rem;
        }
        .gc-2 { border-color: #fca5a5; } .gc-3 { border-color: #fdba74; }
        .gc-4 { border-color: #fde047; } .gc-5 { border-color: #86efac; } .gc-6 { border-color: #93c5fd; }
        .grade-header { text-align: center; font-size: 1.4rem; font-weight: 900; margin-bottom: 0.5rem; color: #374151; border-bottom: 2px dashed #f3f4f6; padding-bottom: 0.5rem; }

        .unit-btn {
            width: 100%; text-align: left; padding: 0.75rem 1rem; border-radius: 0.75rem;
            background: #f9fafb; border: 2px solid #e5e7eb; font-weight: bold; font-size: 0.95rem;
            color: #4b5563; transition: all 0.2s; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; line-height: 1.3;
            position: relative; overflow: hidden;
        }
        .unit-btn:hover { background: #eff6ff; border-color: #60a5fa; color: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* バッジ（達成度）のスタイル */
        .badge { font-size: 1.2rem; margin-left: 0.5rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
        .badge.gold { color: #f59e0b; } /* ★ */
        .badge.perfect { color: #e11d48; } /* 👑 */

        /* --- Drill Screen --- */
        #drill-screen { flex-direction: column; align-items: center; padding-bottom: 2rem; }
        .sheet {
            background: white; width: 210mm; min-height: 297mm; margin: 20px auto; padding: 10mm 15mm; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); position: relative; box-sizing: border-box;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: stretch; min-height: 120px; width: 100%; }
        .header-box { border: 3px solid #374151; border-radius: 10px; padding: 0.8rem 1.2rem; background-color: #fff; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .score-container { border: 3px solid #374151; border-radius: 10px; background-color: #fff; width: 180px; display: flex; flex-direction: column; justify-content: space-between; padding: 0.8rem 1.2rem; flex-shrink: 0; }
        .header-title h1 { white-space: nowrap; font-weight: 900; line-height: 1.3; color: #1f2937; letter-spacing: -0.05em; margin: 0; padding: 0; }
        .header-inputs { display: flex; flex-direction: row; align-items: center; gap: 0.1rem; width: 100%; margin-top: 0.5rem; flex-wrap: nowrap; }
        .header-input { border: none; border-bottom: 2px solid #374151; text-align: center; font-weight: 900; font-size: 1.1rem; outline: none; height: 1.8rem; padding: 0; background: transparent; writing-mode: horizontal-tb; }
        .header-input.short { width: 2.2rem; }
        .header-input.name-input { flex-grow: 1; text-align: left; padding-left: 0.5rem; min-width: 100px; }
        .name-label { font-weight: bold; white-space: nowrap; margin-left: 0.2rem; }
        #score-display { font-size: 4.0rem; font-weight: 900; color: #dc2626; line-height: 1; }

        .problems-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .layout-2col { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3rem; row-gap: 0; height: 100%; align-content: space-between; }

        .problem-item { font-size: 1.05rem; display: flex; align-items: baseline; line-height: 1.4; width: 100%; page-break-inside: avoid; border-bottom: 1px dashed #e5e7eb; padding: 0.5rem 0; }
        .problem-item.spacious { padding-top: 0.8rem; padding-bottom: 1.4rem; }
        .problem-body.large-text { font-size: 1.25rem; width: 100%; text-align: left; }
        .problem-body.huge-text { font-size: 1.8rem; display: flex; align-items: center; justify-content: flex-start; width: 100%; padding-left: 0.5rem; }
        .problem-body.huge-text .math-text { font-size: 2.2rem; margin: 0 0.5rem; }
        .problem-body.huge-text input.box { height: 3.2rem; width: 5.5rem; font-size: 2.2rem; }
        
        .problem-item.visual-problem { flex-direction: column; padding-bottom: 1rem; margin-bottom: 0.5rem; border-bottom: 1px dashed #cbd5e1; }
        .problem-number { flex: 0 0 1.8rem; font-weight: bold; color: #9ca3af; }
        .problem-body { flex-grow: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem; width: 100%; }
        .math-text { font-weight: 800; color: #111827; }
        
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.2rem; font-weight: bold; }
        .fraction .numerator { border-bottom: 2px solid currentColor; padding: 0 0.2rem; line-height: 1; margin-bottom: 0px; }
        .fraction .denominator { line-height: 1; padding-top: 0px; margin-top: 1px; }
        
        .input-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; margin: 0 0.3rem; }

        input.box {
            height: 2.4rem; border: 2px solid #9ca3af; border-radius: 6px; font-weight: bold; text-align: center;
            outline: none; background: #fcfcfc; width: 5rem; font-size: 1.25rem; z-index: 5;
            -webkit-appearance: none; -moz-appearance: textfield; appearance: none;
        }
        input.box::-webkit-outer-spin-button, input.box::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input.box:focus { border-color: #3b82f6; background-color: #eff6ff; }
        
        .mark-correct {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4.4rem; height: 4.4rem; border: 5px solid #ef4444; border-radius: 50%;
            pointer-events: none; z-index: 10; display: none; opacity: 0.8;
        }
        .correct .mark-correct { display: block; animation: pop 0.2s ease-out; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } }
        .incorrect input.box { border-color: #9ca3af; background-color: #f3f4f6; color: #6b7280; }

        .correction-text {
            color: #ef4444; font-weight: 900; font-size: 1.2rem; margin-left: 0.6rem;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            opacity: 0; animation: fadeIn 0.4s forwards;
            position: relative; top: 1px;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .problem-visual-row { display: flex; gap: 0.8rem; height: 130px; margin-top: 0.5rem; width: 100%; position: relative; }
        .problems-container.layout-2col .problem-visual-row { height: 105px; }
        .diagram-area { flex: 2; background-color: #fff; border: 1px solid #e5e7eb; border-radius: 8px; position: relative; overflow: hidden; }
        .memo-area { flex: 1; background-color: #fff; border: 2px dashed #cbd5e1; border-radius: 8px; position: relative; overflow: hidden; cursor: crosshair; }
        .drawing-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; }
        .problem-visual-row.full-memo .diagram-area { display: none; }
        .problem-visual-row.full-memo .memo-area { flex: 1; width: 100%; }
        .memo-label { position: absolute; top: 4px; left: 6px; font-size: 0.75rem; color: #94a3b8; font-weight: bold; pointer-events: none; z-index: 5; }
        .btn-clear {
            position: absolute; top: 4px; right: 4px; background: rgba(241, 245, 249, 0.9); border: 1px solid #cbd5e1;
            border-radius: 4px; width: 24px; height: 24px; font-size: 16px; color: #64748b;
            cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center;
        }
        
        .controls { width: 100%; max-width: 210mm; margin: 10px auto; display: flex; gap: 1rem; justify-content: center; }
        .btn-control {
            font-weight: bold; padding: 0.75rem 1.5rem; border-radius: 9999px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; border: none; font-size: 1rem;
        }
        
        #result-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px);
        }
        #result-modal.show { display: flex; }
        .modal-content { background: white; padding: 3rem; border-radius: 2rem; text-align: center; width: 520px; }
        #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

        @media print {
            body { background: none; display: block; padding: 0; margin: 0; }
            .screen, .controls, #result-modal, #confetti-canvas { display: none !important; }
            .sheet { width: 210mm; height: 296mm; page-break-after: always; padding: 10mm 15mm; margin: 0; box-shadow: none; border: none; }
            #print-area { display: block !important; }
            .drawing-canvas, .btn-clear { display: none !important; }
            .layout-2col .problem-item.spacious { padding-bottom: 1.1rem; }
            .problem-item.visual-problem { padding-bottom: 0.4rem; margin-bottom: 0.4rem; }
            .problem-visual-row { height: 105px; }
            /* 修正: タイトル枠の調整 */
            .header-title h1 { line-height: 1.2; font-size: 2.4rem !important; margin-bottom: 5px; } 
            .header-box { display: block !important; height: auto !important; } /* Flex解除して自然な高さに */
            .header-inputs { margin-bottom: 10px !important; } /* ★追加: 名前欄の下に余白 */
            .mark-correct { display: none !important; }
            .correction-text { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Home Screen -->
    <div id="home-screen" class="screen active">
        <h1 class="text-4xl md:text-5xl font-black text-indigo-600 mb-2 tracking-tight">倍の見方・割合マスター</h1>
        <p class="text-gray-500 font-bold mb-8 text-center px-4">わかる、解ける、自信がつく！「割合」の世界を完ぺきに攻略しよう！</p>
        
        <!-- 各ボタンに data-grade と data-mode を付与 -->
        <div class="grade-columns">
            <div class="grade-column gc-2">
                <div class="grade-header text-rose-500">2年生</div>
                <button class="unit-btn" data-g="2" data-m="0" onclick="window.app.startDrill(2, 0)">かけ算 (20問)<span class="badge"></span></button>
                <button class="unit-btn" data-g="2" data-m="1" onclick="window.app.startDrill(2, 1)">ばいの数①<span class="badge"></span></button>
                <button class="unit-btn" data-g="2" data-m="2" onclick="window.app.startDrill(2, 2)">ばいの数②<span class="badge"></span></button>
                <button class="unit-btn" data-g="2" data-m="3" onclick="window.app.startDrill(2, 3)">長さとかさのばい①<span class="badge"></span></button>
                <button class="unit-btn" data-g="2" data-m="4" onclick="window.app.startDrill(2, 4)">長さとかさのばい②<span class="badge"></span></button>
            </div>
            <div class="grade-column gc-3">
                <div class="grade-header text-orange-500">3年生</div>
                <button class="unit-btn" data-g="3" data-m="0" onclick="window.app.startDrill(3, 0)">倍の計算①<span class="badge"></span></button>
                <button class="unit-btn" data-g="3" data-m="1" onclick="window.app.startDrill(3, 1)">倍の計算②<span class="badge"></span></button>
                <button class="unit-btn" data-g="3" data-m="2" onclick="window.app.startDrill(3, 2)">文章題 (10問)<span class="badge"></span></button>
                <button class="unit-btn" data-g="3" data-m="3" onclick="window.app.startDrill(3, 3)">分数の倍①<span class="badge"></span></button>
                <button class="unit-btn" data-g="3" data-m="4" onclick="window.app.startDrill(3, 4)">分数の倍②<span class="badge"></span></button>
            </div>
            <div class="grade-column gc-4">
                <div class="grade-header text-yellow-500">4年生</div>
                <button class="unit-btn" data-g="4" data-m="0" onclick="window.app.startDrill(4, 0)">何倍（整数）<span class="badge"></span></button>
                <button class="unit-btn" data-g="4" data-m="1" onclick="window.app.startDrill(4, 1)">何倍（小数）<span class="badge"></span></button>
                <button class="unit-btn" data-g="4" data-m="2" onclick="window.app.startDrill(4, 2)">倍の見方（整数）<span class="badge"></span></button>
                <button class="unit-btn" data-g="4" data-m="3" onclick="window.app.startDrill(4, 3)">倍の見方（小数）<span class="badge"></span></button>
                <button class="unit-btn" data-g="4" data-m="4" onclick="window.app.startDrill(4, 4)">小数のわり算<span class="badge"></span></button>
            </div>
            <div class="grade-column gc-5">
                <div class="grade-header text-green-500">5年生</div>
                <button class="unit-btn" data-g="5" data-m="0" onclick="window.app.startDrill(5, 0)">割合を求める<span class="badge"></span></button>
                <button class="unit-btn" data-g="5" data-m="1" onclick="window.app.startDrill(5, 1)">比べられる量<span class="badge"></span></button>
                <button class="unit-btn" data-g="5" data-m="2" onclick="window.app.startDrill(5, 2)">もとにする量<span class="badge"></span></button>
                <button class="unit-btn" data-g="5" data-m="3" onclick="window.app.startDrill(5, 3)">百分率の問題<span class="badge"></span></button>
                <button class="unit-btn" data-g="5" data-m="4" onclick="window.app.startDrill(5, 4)">百分率と割引<span class="badge"></span></button>
            </div>
            <div class="grade-column gc-6">
                <div class="grade-header text-blue-500">6年生</div>
                <button class="unit-btn" data-g="6" data-m="0" onclick="window.app.startDrill(6, 0)">比を簡単に (20問)<span class="badge"></span></button>
                <button class="unit-btn" data-g="6" data-m="1" onclick="window.app.startDrill(6, 1)">比の値 (20問)<span class="badge"></span></button>
                <button class="unit-btn" data-g="6" data-m="2" onclick="window.app.startDrill(6, 2)">比例配分 (計算)<span class="badge"></span></button>
                <button class="unit-btn" data-g="6" data-m="3" onclick="window.app.startDrill(6, 3)">比例配分 (文章題)<span class="badge"></span></button>
                <button class="unit-btn" data-g="6" data-m="4" onclick="window.app.startDrill(6, 4)">拡大図・縮図<span class="badge"></span></button>
            </div>
        </div>
        <div class="mt-8 text-center">
            <button onclick="window.app.resetProgress()" class="text-sm text-gray-400 hover:text-rose-500 underline mb-4">学習記録をリセットする</button>
            <div class="text-gray-400 text-sm font-bold">
                &copy;2026 倍の見方・割合マスター ＩＣＴ支援の杜
            </div>
        </div>
    </div>

    <!-- Drill Screen -->
    <div id="drill-screen" class="screen">
        <div class="controls">
            <button onclick="window.app.goHome()" class="btn-control bg-gray-500 text-white">🏠 戻る</button>
            <button onclick="window.app.generateProblems()" class="btn-control bg-indigo-600 text-white">🔄 問題をつくる</button>
            <button onclick="window.app.checkAnswers()" class="btn-control bg-rose-500 text-white">💮 答えあわせ</button>
            <button onclick="window.app.printSheets()" class="btn-control bg-slate-700 text-white">🖨️ 印刷する</button>
        </div>

        <div class="sheet" id="active-sheet">
            <div class="header-row">
                <div class="header-box">
                    <div class="text-gray-500 font-bold text-sm" id="header-grade-text">年生 算数</div>
                    <div class="header-title"><h1 id="header-title-text">タイトル</h1></div>
                    <div class="header-inputs text-gray-800">
                        <input type="text" class="header-input short"><span>年</span>
                        <input type="text" class="header-input short"><span>組</span>
                        <input type="text" class="header-input short"><span>番</span>
                        <span class="name-label">名前</span>
                        <input type="text" class="header-input name-input">
                    </div>
                </div>
                <div class="score-container">
                    <div class="text-gray-600 font-bold text-left text-xs mb-1">点数</div>
                    <div class="flex items-baseline justify-end pr-6">
                        <span id="score-display" class="text-7xl font-black text-red-600 leading-none"></span>
                    </div>
                </div>
            </div>
            <div class="problems-container" id="problems-container"></div>
        </div>
    </div>

    <div id="print-area"></div>
    <canvas id="confetti-canvas"></canvas>
    <div id="result-modal">
        <div class="modal-content">
            <h2 class="text-3xl font-black mb-2 text-gray-800">結果は...</h2>
            <div id="modal-score" class="text-9xl font-black text-rose-500 mb-6"></div>
            <div id="modal-message" class="text-xl font-bold text-gray-700 mb-8"></div>
            <button class="btn-control bg-blue-600 text-white px-10 mx-auto text-lg" onclick="window.app.closeModal()">とじる</button>
        </div>
    </div>

    <script>
        class MathApp {
            constructor() {
                this.currentGrade = 2;
                this.currentMode = 0;
                this.currentProblems = [];
                this.shuffledPool = [];
                this.modal = document.getElementById('result-modal');
                this.canvas = document.getElementById('confetti-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animationId = null;
                this.STORAGE_KEY = 'mathMaster_v2_progress';

                this.resizeCanvas = this.resizeCanvas.bind(this);
                window.addEventListener('resize', this.resizeCanvas);
                this.resizeCanvas();

                this.CONFIG = {
                    2: [
                        { name: "かけ算 (九九)", type: "kakezan_basic", count: 20 },
                        { name: "ばいの数①", type: "bai_times_1", count: 20 },
                        { name: "ばいの数②", type: "bai_times_2", count: 20 },
                        { name: "長さとかさのばい①", type: "length_volume_bai_1", count: 20 },
                        { name: "長さとかさのばい②", type: "length_volume_bai_2", count: 20 }
                    ],
                    3: [
                        { name: "倍の計算①", type: "bai_calc_1", count: 20 },
                        { name: "倍の計算②", type: "bai_calc_2", count: 20 },
                        { name: "文章題 (10問)", type: "bai_word", count: 10 },
                        { name: "分数の倍①", type: "fraction_part_1", count: 20 },
                        { name: "分数の倍②", type: "fraction_part_2", count: 20 }
                    ],
                    4: [
                        { name: "何倍（整数）", type: "find_bai_4patterns", count: 20 },
                        { name: "何倍（小数）", type: "find_bai_decimal_4patterns", count: 20 },
                        { name: "倍の見方（整数）", type: "bai_mikata_random", count: 5 },
                        { name: "倍の見方（小数）", type: "bai_mikata_decimal", count: 5 },
                        { name: "小数のわり算", type: "decimal_div_word", count: 5 }
                    ],
                    5: [
                        { name: "割合を求める", type: "ratio_p1", count: 5 },
                        { name: "比べられる量", type: "ratio_p2", count: 5 },
                        { name: "もとにする量", type: "ratio_p3", count: 5 },
                        { name: "百分率の問題", type: "ratio_p4", count: 5 },
                        { name: "百分率と割引", type: "ratio_p5", count: 5 }
                    ],
                    6: [
                        { name: "比を簡単に (20問)", type: "simplify_ratio", count: 20 },
                        { name: "比の値 (20問)", type: "ratio_value", count: 20 },
                        { name: "比例配分 (計算)", type: "proportional_dist", count: 20 },
                        { name: "比例配分 (文章題)", type: "proportional_dist_word", count: 5 },
                        { name: "拡大図・縮図", type: "scale_map", count: 5 }
                    ]
                };

                this.updateHomeBadges();
            }

            resizeCanvas() {
                if (this.canvas) {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                }
            }

            getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

            saveProgress(grade, mode, score) {
                const data = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                const key = `${grade}_${mode}`;
                const currentScore = data[key] || 0;
                if (score >= currentScore) {
                    data[key] = score;
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
                }
            }

            updateHomeBadges() {
                const data = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                const buttons = document.querySelectorAll('.unit-btn');
                buttons.forEach(btn => {
                    const g = btn.dataset.g;
                    const m = btn.dataset.m;
                    const key = `${g}_${m}`;
                    const score = data[key];
                    const badgeSpan = btn.querySelector('.badge');
                    
                    if (badgeSpan) {
                        badgeSpan.className = 'badge';
                        badgeSpan.textContent = '';
                        if (score === 100) {
                            badgeSpan.textContent = '👑';
                            badgeSpan.classList.add('perfect');
                        } else if (score >= 80) {
                            badgeSpan.textContent = '★';
                            badgeSpan.classList.add('gold');
                        }
                    }
                });
            }

            playFanfare() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();

                    const playNote = (freq, time, dur) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle'; 
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.3, time);
                        gain.gain.exponentialRampToValueAtTime(0.01, time + dur - 0.05);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + dur);
                    };

                    const now = ctx.currentTime;
                    playNote(392.00, now + 0.0, 0.15); // G4
                    playNote(523.25, now + 0.15, 0.15); // C5
                    playNote(659.25, now + 0.30, 0.15); // E5
                    playNote(783.99, now + 0.45, 0.30); // G5
                    playNote(1046.50, now + 0.75, 1.2); // C6
                    playNote(523.25, now + 0.75, 1.2); // C5
                    playNote(659.25, now + 0.75, 1.2); // E5

                } catch (e) {
                    console.error("Audio play failed", e);
                }
            }

            getFindBaiPool(type) {
                let pool = [];
                const units = ["cm", "m", "kg", "g", "L", "dL", "mL", "円"];
                const isDecimal = type.includes("decimal");
                
                let pairs = [];
                if (isDecimal) {
                    const bases = [20, 30, 40, 50, 60, 70, 80, 90];
                    const ratios = [1.2, 1.5, 2.4, 2.5, 3.2];
                    for (let b of bases) {
                        for (let t of ratios) {
                            pairs.push({ b, t });
                        }
                    }
                } else {
                    // Integer case: Base is 3 digits (100-999), Ratio is 2-9
                    // Constraint 1: Result must be <= 999 (No 4-digit numbers)
                    // Constraint 2: Base's ones digit must be 0 (e.g. 120, 350)
                    const seen = new Set();
                    let attempts = 0;
                    while(pairs.length < 35 && attempts < 1000) { 
                        attempts++;
                        let t = this.getRandomInt(2, 9);
                        
                        // Calculate max base to keep product <= 999
                        let maxB = Math.floor(999 / t);
                        
                        // Base must be at least 100 and have ones digit 0.
                        // So we look for multiples of 10 in range [100, maxB].
                        // Range for (b/10) is [10, floor(maxB/10)].
                        let minDiv10 = 10;
                        let maxDiv10 = Math.floor(maxB / 10);

                        if (maxDiv10 < minDiv10) continue; // Can't form a 3-digit number

                        let val = this.getRandomInt(minDiv10, maxDiv10);
                        let b = val * 10;
                        
                        let key = `${b}_${t}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            pairs.push({ b, t });
                        }
                    }
                }

                pairs.sort(() => Math.random() - 0.5);

                const count = Math.min(pairs.length, 35);
                for(let i=0; i<count; i++) {
                    const pData = pairs[i];
                    const b = pData.b;
                    const t = pData.t;
                    const total = Math.round(b * t * 10)/10;
                    
                    const unit = units[i % units.length]; 
                    const p = i % 3;

                    if (p === 0) pool.push({ text: `<span class="math-text">${total}</span>${unit}は <span class="math-text">${b}</span>${unit}の 何倍ですか。`, answer: t, unit: "倍", base: b, compare: total, ratio: t });

                }
                
                return pool;
            }

                    // 3. Fraction : Fraction (Target)

                            if (d1 === d2) continue;

                            if (n1 === d1 || gcd(n1, d1) !== 1) continue;

                            // Rule: Ratio != 1 (fractions not equal)
                            // n1/d1 == n2/d2  => n1*d2 == n2*d1
                            if (n1 * d2 === n2 * d1) continue;
                            
                            valid = true;
                        }
                        
                        // Calculate Ratio Value: (n1/d1) / (n2/d2) = (n1*d2) / (d1*n2)
                        let ansN = n1 * d2;
                        let ansD = d1 * n2;
                        let ansGCD = gcd(ansN, ansD);

            get6thGradeSimplifyRatioPool() {

                const wrapper = (content) => `<div class="flex flex-row items-center w-full text-left ml-4 text-lg whitespace-nowrap overflow-x-hidden">${content}</div>`;

                    if (i < 3) {
                        a = this.getRandomInt(1, 9);

                        while(gcd(a, b) === 1 || a === b) { // Require simplification
                             a = this.getRandomInt(2, 9);
                             b = this.getRandomInt(2, 9);
                        }
                        // Simplify a,b to get answer
                        let d = gcd(a, b);
                        let ansA = a / d;
                        let ansB = b / d;
                        
                        // Re-logic:
                        ansA = this.getRandomInt(1, 9);
                        ansB = this.getRandomInt(1, 9);
                        while(ansA === ansB || gcd(ansA, ansB) !== 1) {
                            ansA = this.getRandomInt(1, 9);

                    } else {

                        // Use larger multipliers
                        let ansA = this.getRandomInt(1, 9);

                        // Ensure they look "large" (at least one > 30) and not too easy (like 20:30)
                        while (q1 < 20 && q2 < 20) {

                // 3. Fraction : Fraction (Constraint: Different denominators)
                for(let i=0; i<5; i++) {

                        a = this.getRandomInt(1, 5); b = this.getRandomInt(1, 5);

                        // Reduce source fractions first to avoid 2/4 vs 1/2 issues effectively being same denominator logic?
                        // Actually, just checking da !== db is usually enough, but let's be safe.
                        // The prompt says "Same denominator questions are not allowed".
                        
                        // Calculate simplest ratio
                        let g1 = gcd(a, da); a/=g1; da/=g1;
                        let g2 = gcd(b, db); b/=g2; db/=g2;
                        
                        ra = a * db; rb = b * da;
                        let d = gcd(ra, rb); ra /= d; rb /= d;
                    } while (da === 1 || db === 1 || ra === rb || da === db); // Added da === db

                    const f1 = `<span class="fraction"><span class="numerator">${a}</span><span class="denominator">${da}</span></span>`;

                        ra = a; rb = b * da;
                        let d = gcd(ra, rb); ra /= d; rb /= d;

                    const f1 = `<span class="fraction"><span class="numerator">${a}</span><span class="denominator">${da}</span></span>`;
                    pool.push({ html: wrapper(`<span class="math-text text-2xl flex items-center gap-1 mr-2">${f1} : ${b}</span> ＝ <div class="input-wrapper mx-1"><input type="text" class="box" style="width: 2.8rem;" autocomplete="off" data-ans="${ra}"><div class="mark-correct"></div></div> : <div class="input-wrapper mx-1"><input type="text" class="box" style="width: 2.8rem;" autocomplete="off" data-ans="${rb}"><div class="mark-correct"></div></div>`) });
                }
                return pool.sort(() => Math.random() - 0.5);
            }

            generateProblems() {
                this.currentProblems = [];
                const config = this.CONFIG[this.currentGrade][this.currentMode];
                this.shuffledPool = []; 

                if (config.type === "kakezan_basic") {
                    this.shuffledPool = this.getKakezanPool();
                } else if (config.type.startsWith("bai_times") || config.type.startsWith("length_volume_bai")) {
                    this.shuffledPool = this.getGrade2Pool(config.type);
                } else if (config.type.startsWith("fraction_part")) {
                    this.shuffledPool = this.getFractionPartPool(config.type);
                } else if (config.type.startsWith("bai_calc")) {
                    this.shuffledPool = this.getGrade3BaiCalcPool(config.type);
                } else if (config.type === "bai_word") {
                    this.shuffledPool = this.getGrade3WordPool();
                } else if (config.type === "decimal_div_word") {
                    this.shuffledPool = this.get4thGradeDecimalDivWordPool();
                } else if (config.type.startsWith("find_bai_")) {
                    this.shuffledPool = this.getFindBaiPool(config.type);
                } else if (config.type === "bai_mikata_random" || config.type === "bai_mikata_decimal") {
                    this.shuffledPool = this.get4thGradeMikataPool(config.type);
                } else if (config.type === "ratio_p4") {
                    this.shuffledPool = this.get5thGradePercentPool();
                } else if (config.type === "ratio_p5") {
                    this.shuffledPool = this.get5thGradeDiscountPool();
                } else if (config.type.startsWith("ratio_p")) {
                    this.shuffledPool = this.get5thGradePool(config.type);
                } else if (config.type === "proportional_dist_word") {
                    this.shuffledPool = this.get6thGradeProportionalDistWordPool();
                } else if (config.type === "scale_map") {
                    this.shuffledPool = this.get6thGradeScaleMapPool();
                } else if (config.type === "simplify_ratio") {
                    this.shuffledPool = this.get6thGradeSimplifyRatioPool();
                } else if (config.type === "ratio_value") {
                    this.shuffledPool = this.get6thGradeRatioValuePool();
                } else if (config.type === "proportional_dist") {
                    this.shuffledPool = this.get6thGradeProportionalDistPool();
                }

                if (!this.shuffledPool || this.shuffledPool.length === 0) {
                     console.warn("Problem pool is empty. Please ensure all get...Pool methods are implemented.");
                     return;
                }

                const poolSize = this.shuffledPool.length;
                if (poolSize > 0) {
                     this.shuffledPool.sort(() => Math.random() - 0.5);
                     const history = new Set();
                     for(let i=0; i < config.count; i++) {
                        let q = this.shuffledPool[i % poolSize];
                        if ((config.type.startsWith('ratio_p') || config.type.includes('mikata') || config.type === 'decimal_div_word') && q.scenarioId) {
                             if (history.has(q.scenarioId)) {
                                 const next = this.shuffledPool.find(p => !history.has(p.scenarioId));
                                 if (next) q = next;
                             }
                             history.add(q.scenarioId);
                        }
                        this.currentProblems.push(this.formatProblem(config.type, q));
                     }
                } else {
                    for(let i=0; i < config.count; i++) {
                        this.currentProblems.push(this.formatProblem(config.type, null));
                    }
                }
                
                this.renderProblems(this.currentProblems, document.getElementById('problems-container'), config.count, config.type);
            }

             formatProblem(type, q) {

                if (q && q.html) { template = q.html; a = null; } 
                else if (q.text) {
                    a = q.a || q.answer;
                    const textDisp = q.textFull || q.text;
                    const inputHtml = `<div class="input-wrapper"><input type="text" class="box" data-ans="${a}"><div class="mark-correct"></div></div>`;

                    } else {
                        template = `<div class="w-full text-left">${textDisp}</div><div class="w-full text-right">答え：${inputHtml}${q.ul || q.unitLabel || q.unit || "" }</div>`;
                    }
                    if (type === "bai_word") diagramParams = null;
                    else {
                        if (q.diagramParams) {
                            diagramParams = q.diagramParams;
                        } else {
                            let b = q.base, c = q.compare, r = q.ratio;
                            if (q.base === a) b = null; 
                            else if (q.compare === a) c = null; 
                            else if (q.ratio === a) r = null;
                            diagramParams = { type: 'tape', base: b, compare: c, ratio: r, label1: q.bl || "もと", label2: q.cl || "くらべる", unitLabel: q.ul === "倍" || q.ul === "%" ? "" : (q.ul || q.unitLabel || q.unit), baseIsTop: true };
                        }
                    }

                    let n1 = this.getRandomInt(2, 9), n2 = this.getRandomInt(1, 9); a = n1 * n2;
                    template = `<div class="flex items-center text-xl justify-start w-full text-left pl-4"><span class="math-text text-2xl">${n1}</span> <span class="math-text text-2xl">×</span> <span class="math-text text-2xl">${n2}</span> <span class="math-text text-2xl">＝</span> <div class="input-wrapper"><input type="text" class="box" data-ans="${a}"><div class="mark-correct"></div></div></div>`;
                } else if (type.startsWith("fraction_part")) {

                    template = `<div class="flex items-center text-xl justify-start w-full text-left pl-4"><span class="math-text text-2xl">${v}</span>この <span class="fraction ml-2"><span class="numerator text-xl">${1}</span><span class="denominator text-xl">${d}</span></span>は <div class="input-wrapper ml-2"><input type="text" class="box" data-ans="${a}"><div class="mark-correct"></div></div>こ</div>`; 
                }
                return { template, answer: a, diagramParams };
             }
             
             createTapeDiagram(p) {
                const w = 500, h = 160, pl = 100, bh = 25, sp = 35;
                let dB = p.base, dC = p.compare, dR = p.ratio;
                
                if (dB === null && dC !== null && dR) dB = dC / dR; 
                else if (dC === null && dB !== null && dR) dC = dB * dR;
                else if (dR === null && dB !== null && dC !== null) dR = dC / dB;

                const sMax = Math.max(dB||1, dC||1) * 1.25;
                const bw = (dB / (sMax||1)) * 350;
                const cw = (dC / (sMax||1)) * 350;
                const ay = 110;
                
                let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
                
                svg += `<text x="${pl-8}" y="28" text-anchor="end" font-size="12" font-weight="900" fill="#4b5563">${p.label1}</text>`;
                svg += `<rect x="${pl}" y="10" width="${bw}" height="${bh}" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" rx="4" />`;
                svg += `<text x="${pl+bw/2}" y="28" text-anchor="middle" font-size="12" font-weight="bold">${p.base===null ? "□" : p.base}${p.unitLabel||""}</text>`;
                
                svg += `<text x="${pl-8}" y="81" text-anchor="end" font-size="12" font-weight="900" fill="#4b5563">${p.label2}</text>`;
                svg += `<rect x="${pl}" y="63" width="${cw}" height="${bh}" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="4" />`;
                svg += `<text x="${pl+cw/2}" y="81" text-anchor="middle" font-size="12" font-weight="bold">${p.compare===null ? "□" : p.compare}${p.unitLabel||""}</text>`;
                
                svg += `<line x1="${pl}" y1="${ay}" x2="${pl+360}" y2="${ay}" stroke="#1f2937" stroke-width="2" />`;
                svg += `<text x="${pl}" y="${ay+20}" text-anchor="middle" font-size="12" font-weight="bold">0</text>`;
                
                svg += `<line x1="${pl+bw}" y1="${10+bh}" x2="${pl+bw}" y2="${ay+5}" stroke="#94a3b8" stroke-dasharray="4" />`;
                svg += `<text x="${pl+bw}" y="${ay+20}" text-anchor="middle" font-size="12" font-weight="900">1</text>`;
                
                svg += `<line x1="${pl+cw}" y1="${63+bh}" x2="${pl+cw}" y2="${ay+5}" stroke="#94a3b8" stroke-dasharray="4" />`;
                
                let rText = "";
                if (p.ratio === null) {
                    rText = "□";
                } else {
                    rText = (p.ratio % 1 === 0 ? p.ratio : p.ratio.toFixed(1));
                }
                svg += `<text x="${pl+cw}" y="${ay+22}" text-anchor="middle" font-size="12" font-weight="900" fill="#ef4444">${rText}</text>`;
                
                return svg + `</svg>`;
             }

            renderProblems(problems, container, count, type) {
                container.innerHTML = '';
                container.className = 'problems-container ' + (count >= 10 ? 'layout-2col' : '');
                const lrg = ['kakezan_basic', 'ratio_value', 'fraction_part_1', 'fraction_part_2', 'bai_times_1', 'bai_times_2', 'length_volume_bai_1', 'length_volume_bai_2', 'bai_calc_1', 'bai_calc_2', 'find_bai_4patterns', 'find_bai_decimal_4patterns', 'simplify_ratio', 'proportional_dist'];
                problems.forEach((p, i) => {
                    let body = p.template; 
                    if (count === 5 || count === 10) {
                        let diag = p.diagramParams ? this.createTapeDiagram(p.diagramParams) : "";
                        if (p.diagramParams) {
                             container.innerHTML += `<div class="problem-item visual-problem"><div class="flex w-full mb-1"><div class="problem-number">(${i+1})</div><div class="problem-body">${body}</div></div><div class="problem-visual-row"><div class="diagram-area">${diag}<canvas class="drawing-canvas"></canvas><button class="btn-clear" onclick="window.app.clearCanvas(this)">×</button></div><div class="memo-area"><span class="memo-label">計算メモ</span><canvas class="drawing-canvas"></canvas><button class="btn-clear" onclick="window.app.clearCanvas(this)">×</button></div></div></div>`;
                        } else {
                             container.innerHTML += `<div class="problem-item visual-problem"><div class="flex w-full mb-1"><div class="problem-number">(${i+1})</div><div class="problem-body">${body}</div></div><div class="problem-visual-row full-memo"><div class="memo-area"><span class="memo-label">計算メモ</span><canvas class="drawing-canvas"></canvas><button class="btn-clear" onclick="window.app.clearCanvas(this)">×</button></div></div></div>`;
                        }
                    } else {
                        let eC = (count === 20) ? ' spacious' : '';
                        let isHuge = type === 'kakezan_basic' || type.startsWith('fraction_part');
                        let isLarge = lrg.includes(type);
                        let bC = isHuge ? ' problem-body huge-text' : (isLarge ? ' problem-body large-text' : ' problem-body');
                        container.innerHTML += `<div class="problem-item ${eC}"><div class="problem-number">(${i+1})</div><div class="${bC}">${body}</div></div>`;
                    }
                });
                setTimeout(() => this.initCanvases(), 150);
            }

            initCanvases() {
                document.querySelectorAll('.drawing-canvas').forEach(canvas => {
                    const parent = canvas.parentElement; canvas.width = parent.clientWidth; canvas.height = parent.clientHeight;
                    const ctx = canvas.getContext('2d'); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#334155';
                    let drawing = false; const getPos = (e) => { const rect = canvas.getBoundingClientRect(); return { x: (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left, y: (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top }; };
                    canvas.onmousedown = (e) => { drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
                    canvas.onmousemove = (e) => { if(drawing) { const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); } };
                    canvas.onmouseup = () => drawing = false; canvas.onmouseleave = () => drawing = false;
                    canvas.ontouchstart = (e) => { drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); e.preventDefault(); };
                    canvas.ontouchmove = (e) => { if(drawing) { const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); } e.preventDefault(); };
                });
            }
            clearCanvas(btn) { 
                const canvas = btn.parentElement.querySelector('canvas'); 
                if (canvas) { 
                    const ctx = canvas.getContext('2d'); 
                    ctx.clearRect(0, 0, canvas.width, canvas.height); 
                } 
            }


            // --- 答え合わせロジック (Ver.2 改修版) ---
            checkAnswers() {
                let correctCount = 0;
                const wrappers = document.querySelectorAll('.input-wrapper');
                
                // 既存の正解表示をリセット
                document.querySelectorAll('.correction-text').forEach(el => el.remove());

                wrappers.forEach(wrapper => {
                    const input = wrapper.querySelector('input.box');
                    if (!input) return;
                    
                    const v = input.value.trim().replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
                    const ansData = input.dataset.ans; 
                    
                    if (!ansData || v === "") {
                        wrapper.classList.remove('correct', 'incorrect');
                        return;
                    }

                    // 数値として比較（誤差許容）
                    let isCorrect = Math.abs(parseFloat(ansData) - parseFloat(v)) < 0.001;
                    
                    if (isCorrect) { 
                        wrapper.classList.add('correct'); 
                        wrapper.classList.remove('incorrect'); 
                        correctCount++; 
                    } else { 
                        wrapper.classList.add('incorrect'); 
                        wrapper.classList.remove('correct'); 
                        
                        const correction = document.createElement('span');
                        correction.className = 'correction-text';
                        correction.textContent = ansData;
                        wrapper.parentNode.insertBefore(correction, wrapper.nextSibling);
                    }
                });

                const score = wrappers.length > 0 ? Math.round((correctCount / wrappers.length) * 100) : 0;
                
                // スコア表示
                document.getElementById('score-display').textContent = score;
                document.getElementById('modal-score').textContent = score + "点";
                document.getElementById('modal-message').textContent = score === 100 ? "すばらしい！かんぺきです！" : "おしい！あかい数字を見て復習しよう！";
                
                this.modal.classList.add('show');
                
                if (score === 100) {
                    this.startConfetti();
                    this.playFanfare();
                }

                // ★Ver.2追加: 進捗の保存
                this.saveProgress(this.currentGrade, this.currentMode, score);
            }

            closeModal() { this.modal.classList.remove('show'); this.stopConfetti(); }

            startConfetti() {
                this.particles = [];
                for(let i=0; i<200; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width, y: -10,
                        size: Math.random() * 8 + 4, speed: Math.random() * 5 + 3,
                        color: `hsl(${Math.random()*360}, 80%, 60%)`, angle: Math.random() * 6.28
                    });
                }
                const animate = () => {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.particles.forEach(p => {
                        p.y += p.speed; p.x += Math.sin(p.angle) * 2;
                        if(p.y > this.canvas.height) p.y = -10;
                        this.ctx.fillStyle = p.color; this.ctx.fillRect(p.x, p.y, p.size, p.size);
                    });
                    this.animationId = requestAnimationFrame(animate);
                };
                animate();
            }

            stopConfetti() {
                if(this.animationId) cancelAnimationFrame(this.animationId);
                if(this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            printSheets() {
                const area = document.getElementById('print-area'); area.innerHTML = '';
                const create = (ans) => {
                    const sheet = document.getElementById('active-sheet').cloneNode(true);
                    if(ans) sheet.querySelectorAll('input.box').forEach(i => i.value = i.dataset.ans || '');
                    // 印刷用シートからはcanvasやボタンを削除
                    sheet.querySelectorAll('.drawing-canvas, .btn-clear, .correction-text').forEach(e => e.remove());
                    area.appendChild(sheet);
                };
                create(false); // 問題
                create(true);  // 解答
                window.print();
            }
        }
        window.app = new MathApp();
    </script>
